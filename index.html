<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Office Time Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="dark">

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Office Time Tracker</span>
    </div>
    <div class="topbar-right">
      <div class="clock-live">
        <div class="date" id="liveDate">—</div>
        <div class="time" id="liveTime">—:—:—</div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">🌙</button>
      <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙️</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="home" role="tab" aria-selected="true">Главная</button>
    <button class="tab-btn" data-tab="timer" role="tab" aria-selected="false">Таймер</button>
    <button class="tab-btn" data-tab="history" role="tab" aria-selected="false">История</button>
    <button class="tab-btn" data-tab="stats" role="tab" aria-selected="false">Статистика</button>
  </nav>

  <!-- ============ ГЛАВНАЯ: калькулятор времени ухода ============ -->
  <section class="tab-panel active" id="panel-home">

    <div class="arrival-card">
      <div class="section-title" style="margin-bottom:14px;">Время прихода в офис</div>

      <div class="time-input-row">
        <input
          type="time"
          id="arrivalTimeInput"
          class="time-input"
          inputmode="numeric"
          aria-label="Время прихода">
        <button class="btn btn-primary btn-pick" id="arrivalPickBtn" type="button" aria-label="Выбрать время">
          🕐 Выбрать
        </button>
      </div>

      <div class="departure-results" id="departureResults">
        <!-- рендерится из ui.js -->
      </div>
    </div>
  </section>

  <!-- ============ ТАЙМЕР ============ -->
  <section class="tab-panel" id="panel-timer">

    <div class="hero-card">
      <div class="hero-status" id="heroStatus">Загрузка…</div>

      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 260 260">
          <circle class="ring-track" cx="130" cy="130" r="112"></circle>
          <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="112"
                  stroke-dasharray="703.7" stroke-dashoffset="703.7"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-countdown" id="ringCountdown">--:--:--</div>
          <div class="ring-caption" id="ringCaption">Загружаем состояние дня…</div>
        </div>
      </div>

      <div class="hero-progress-label" id="heroProgressLabel">Прогресс рабочего дня: <strong>0%</strong></div>

      <div class="hero-actions" id="heroActions">
        <!-- кнопки рендерятся из ui.js в зависимости от состояния -->
      </div>
    </div>

    <div class="stat-grid" id="statGrid">
      <div class="stat-card"><div class="label">Начало</div><div class="value" id="cardStart">—</div></div>
      <div class="stat-card"><div class="label">Окончание</div><div class="value" id="cardEnd">—</div></div>
      <div class="stat-card"><div class="label">Рабочее время</div><div class="value" id="cardWorkLen">—</div></div>
      <div class="stat-card"><div class="label">Перерыв</div><div class="value" id="cardBreakLen">—</div></div>
      <div class="stat-card"><div class="label">Прошло</div><div class="value" id="cardElapsed">—</div></div>
      <div class="stat-card"><div class="label">Осталось</div><div class="value" id="cardRemaining">—</div></div>
    </div>
  </section>

  <!-- ============ ИСТОРИЯ ============ -->
  <section class="tab-panel" id="panel-history">
    <h2 class="section-title">История рабочих дней</h2>
    <div class="history-table-wrap" id="historyWrap">
      <!-- рендерится из ui.js -->
    </div>
  </section>

  <!-- ============ СТАТИСТИКА ============ -->
  <section class="tab-panel" id="panel-stats">
    <h2 class="section-title">Статистика</h2>
    <div class="stat-grid-2" id="statsSummary">
      <!-- рендерится из ui.js -->
    </div>
    <div class="chart-card">
      <div class="section-title" style="margin-bottom:0;">Рабочее время по дням</div>
      <div class="bar-chart" id="barChart">
        <!-- рендерится из ui.js -->
      </div>
    </div>
  </section>

</div>

<!-- ============ МОДАЛЬНОЕ ОКНО НАСТРОЕК ============ -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <h2 id="settingsTitle">Настройки рабочего дня</h2>
      <button class="icon-btn" id="settingsCloseBtn" aria-label="Закрыть">✕</button>
    </div>

    <div class="field">
      <label for="inputStartTime">Начало рабочего дня</label>
      <input type="time" id="inputStartTime" value="09:00">
    </div>

    <div class="field">
      <label for="inputWorkHours">Рабочее время, часов</label>
      <input type="number" id="inputWorkHours" min="1" max="16" step="0.5" value="8">
    </div>

    <div class="field">
      <label for="inputBreakMinutes">Перерыв, минут</label>
      <input type="number" id="inputBreakMinutes" min="0" max="240" step="5" value="60">
    </div>

    <div class="field">
      <label>Рабочие дни недели</label>
      <div class="days-row" id="daysRow">
        <!-- рендерится из ui.js -->
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="settingsCancelBtn">Отмена</button>
      <button class="btn btn-primary" id="settingsSaveBtn">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/timer.js"></script>
<script src="js/statistics.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
